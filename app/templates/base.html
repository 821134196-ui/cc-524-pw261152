<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}批量评分平台{% endblock %}</title>
{% if refresh %}<meta http-equiv="refresh" content="3">{% endif %}
<style>
  :root { --bd:#e2e8f0; --fg:#1e293b; --muted:#64748b; --bg:#f8fafc; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--fg); background:var(--bg); }
  nav { background:#0f172a; color:#fff; padding:10px 24px; display:flex; gap:20px; align-items:center; }
  nav a { color:#cbd5e1; text-decoration:none; } nav a:hover { color:#fff; }
  nav .brand { font-weight:700; color:#fff; }
  main { max-width:1180px; margin:24px auto; padding:0 20px; }
  h1 { font-size:20px; } h2 { font-size:16px; margin-top:28px; }
  table { border-collapse:collapse; width:100%; background:#fff; margin:12px 0; }
  th, td { border:1px solid var(--bd); padding:7px 10px; text-align:left; vertical-align:top; }
  th { background:#f1f5f9; font-weight:600; white-space:nowrap; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:8px; padding:14px 16px; margin:10px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:12px 0; }
  .stat { background:#fff; border:1px solid var(--bd); border-radius:8px; padding:12px; }
  .stat .n { font-size:24px; font-weight:700; }
  .stat .l { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .st-success { background:#dcfce7; color:#166534; }
  .st-partial_failed { background:#fef9c3; color:#854d0e; }
  .st-failed { background:#fee2e2; color:#991b1b; }
  .st-running { background:#dbeafe; color:#1d4ed8; }
  .st-pending { background:#e2e8f0; color:#475569; }
  .st-published { background:#f3e8ff; color:#7e22ce; }
  .st-withdrawn { background:#f1f5f9; color:#64748b; }
  .st-active { background:#dcfce7; color:#166534; }
  .st-rolled_back { background:#fee2e2; color:#991b1b; }
  .hash { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--muted); }
  code, pre { font-family:ui-monospace,Menlo,monospace; font-size:12px; background:#f1f5f9; border-radius:4px; }
  code { padding:1px 5px; } pre { padding:10px; overflow:auto; }
  .btn { display:inline-block; border:1px solid var(--bd); background:#fff; border-radius:6px; padding:5px 12px; cursor:pointer; font-size:13px; text-decoration:none; color:var(--fg); }
  .btn:hover { background:#f1f5f9; }
  .btn-primary { background:#2563eb; border-color:#2563eb; color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .btn-danger { background:#dc2626; border-color:#dc2626; color:#fff; }
  .btn-danger:hover { background:#b91c1c; }
  form.inline { display:inline; }
  input[type=text], input[type=number], select, textarea { border:1px solid var(--bd); border-radius:6px; padding:6px 8px; font:inherit; width:100%; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  .form-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .chain { display:flex; flex-wrap:wrap; gap:0; align-items:stretch; }
  .chain .node { flex:1; min-width:170px; background:#fff; border:1px solid var(--bd); border-radius:8px; padding:10px 12px; }
  .chain .arrow { align-self:center; padding:0 8px; color:var(--muted); font-size:18px; }
  .chain .node .t { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .chain .node .v { font-weight:600; margin:2px 0; }
  .diff-changed { background:#fff7ed; } .diff-added { background:#f0fdf4; } .diff-removed { background:#fef2f2; }
  .pos { color:#166534; } .neg { color:#991b1b; }
  .muted { color:var(--muted); } .err { color:#991b1b; font-size:12px; }
  .flash-ok { color:#166534; }
</style>
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('page_dashboard') }}">批量评分平台</a>
  <a href="{{ url_for('page_dashboard') }}">批次看板</a>
  <a href="{{ url_for('page_assets') }}">资产（数据/快照/模型）</a>
  <a href="{{ url_for('page_submit') }}">提交批次</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
